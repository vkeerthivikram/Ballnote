name: Release APK
run-name: Ballnote ${{ inputs.version }} · ${{ inputs.publish_release && 'publish' || 'build only' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, e.g. 1.0.0 (use a new version for each release)'
        required: true
        default: '1.0.0'
        type: string
      prerelease:
        description: Mark as a prerelease
        default: false
        type: boolean
      publish_release:
        description: 'Publish a tag and GitHub Release (uncheck for build-only verification)'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo 'Use a version such as 1.0.0 or 1.1.0-beta.1.' >&2
            exit 1
          fi
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Publish releases from main. Other branches support build-only runs.' >&2
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install Android SDK packages
        shell: bash
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 repository secret.' >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ballnote-release.jks"
      - name: Test, lint and build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ballnote-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease \
            "-PreleaseVersionName=$VERSION" "-PreleaseVersionCode=$((1000 + GITHUB_RUN_NUMBER))"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Ballnote-v$VERSION.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "dist/Ballnote-v$VERSION.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ballnote-release.jks"
      - name: Upload APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ballnote-${{ steps.version.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ballnote-${{ needs.build.outputs.tag }}
          path: dist
      - name: Create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tagged_commit=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo 'This tag points to different code. Choose a new version.' >&2
              exit 1
            fi
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=()
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            notes=(--generate-notes)
            if [[ -f CHANGELOG.md ]]; then
              awk -v heading="## [${TAG#v}]" '
                /^## / {
                  if (found) exit
                  if (index($0, heading) == 1) { found=1; next }
                }
                found { print }
              ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
              if grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
                notes=(--notes-file "$RUNNER_TEMP/release-notes.md")
              fi
            fi
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Ballnote $TAG" "${notes[@]}" "${flags[@]}"
          fi
          gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          echo "Release: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
